name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv

      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          echo "=== Lines with errors ==="
          grep -n -i -E "error|failed|Traceback" build.log | grep -v -i "warning" | tail -n 40
          echo "=== Last 60 lines ==="
          tail -n 60 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-downloader-apk
          path: bin/*.apk
